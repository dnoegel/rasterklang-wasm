name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Require release tag
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *)
              echo "Release workflow must run from a v* tag, got ${GITHUB_REF}"
              exit 1
              ;;
          esac

      - name: Run tests
        run: make check

      - name: Build release archive
        env:
          VERSION: ${{ github.ref_name }}
        run: make dist VERSION="${VERSION}"

      - name: Verify npm package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          node scripts/check-package-version.mjs --version "${VERSION}"
          npm pack --dry-run

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "${TAG}" dist/*.tar.gz dist/*.sha256 \
              --title "${TAG}" \
              --notes "rasterklang-wasm ${TAG}"
          fi

      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set; skipping npm publish."
            exit 0
          fi
          npm publish --provenance --access public
